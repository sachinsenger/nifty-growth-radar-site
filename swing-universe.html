 index constituent snapshot (30D/1Y return and 52-week position) until deeper technical coverage is added. Memberships are refreshed daily. A stock may appear in multiple index tabs.</div>';const show=id=>{document.querySelectorAll('.su-tab').forEach(t=>t.classList.toggle('active',t.dataset.su===id));document.querySelectorAll('.su-panel').forEach(p=>p.classList.toggle('active',p.id==='su-'+id));};document.querySelectorAll('.su-tab').forEach(t=>t.onclick=()=>show(t.dataset.su));const renderIndex=()=>{const k=document.querySelector('#su-index-select').value;document.querySelector('#su-index-table').innerHTML=table(D.indexes[k].symbols.filter(s=>stocks[s]));};document.querySelector('#su-index-select').onchange=renderIndex;renderIndex();document.querySelectorAll('[data-su-search]').forEach(i=>i.oninput=()=>{const q=i.value.toLowerCase();document.querySelectorAll('#su-table-'+i.dataset.su+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')});show('n50');})();</script></body></html>
